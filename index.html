<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QalbiiAI - Multilingual AI Assistant</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
      min-height: 100vh;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
    }

    header p {
      margin-top: 6px;
      color: #cbd5e1;
    }

    .container {
      max-width: 800px;
      margin: 30px auto;
      padding: 20px;
    }

    .welcome {
      text-align: center;
      margin-bottom: 25px;
    }

    .welcome h2 {
      font-size: 26px;
      margin-bottom: 10px;
    }

    .welcome p {
      color: #64748b;
    }

    .chat-box {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    .messages {
      min-height: 250px;
      padding: 10px;
      margin-bottom: 15px;
    }

    .message {
      padding: 12px 15px;
      border-radius: 12px;
      margin-bottom: 12px;
      max-width: 85%;
      line-height: 1.5;
    }

    .ai {
      background: #eef2ff;
      margin-right: auto;
    }

    .user {
      background: #111827;
      color: white;
      margin-left: auto;
    }

    .input-area {
      display: flex;
      gap: 10px;
    }

    .input-area input {
      flex: 1;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    .input-area button {
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .input-area button:hover {
      background: #374151;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #64748b;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <h1>QalbiiAI</h1>
    <p>Multilingual AI Assistant</p>
  </header>

  <main class="container">

    <section class="welcome">
      <h2>Welcome to QalbiiAI 🤖</h2>
      <p>Ask your question in any language.</p>
    </section>

    <section class="chat-box">

      <div class="messages" id="messages">
        <div class="message ai">
          👋 Hello! I am QalbiiAI. How can I help you?
        </div>
      </div>

      <div class="input-area">
        <input
          type="text"
          id="userInput"
          placeholder="Ask QalbiiAI anything..."
        >

        <button onclick="sendMessage()">
          Send
        </button>
      </div>

    </section>

  </main>

  <footer>
    © 2026 QalbiiAI. All rights reserved.
  </footer>

  <script>
    function sendMessage() {
      const input = document.getElementById("userInput");
      const messages = document.getElementById("messages");

      const text = input.value.trim();

      if (text === "") {
        return;
      }

      const userMessage = document.createElement("div");
      userMessage.className = "message user";
      userMessage.textContent = text;

      messages.appendChild(userMessage);

      input.value = "";

      const aiMessage = document.createElement("div");
      aiMessage.className = "message ai";
      aiMessage.textContent =
        "QalbiiAI is ready. AI connection will be added next.";

      messages.appendChild(aiMessage);

      messages.scrollTop = messages.scrollHeight;
    }

    document.getElementById("userInput").addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
  </script>

</body>
</html>
